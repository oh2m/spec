pattern: 8
domain: Substances
spec_version: 0.1.1
status: DRAFT
authored_by: jamal
last_revised: 2026-04-30
polarity_note: "V flag inverts bit storage; question text is never inverted."
ratification: pending community review
scope_exclusions:
  - "Quantities, frequencies, sources, or specific dosing of currently-used substances"
  - "Specific substance names beyond broad classes for substances criminalized in most jurisdictions"
  - "Information that could constitute self-incrimination in the user's likely jurisdiction"

questions:

  # ---- Tobacco and Nicotine ----
  - pos: 1
    q: "Are you currently a daily cigarette smoker?"
  - pos: 2
    q: "Are you a former daily cigarette smoker who has quit?"
    v: true
  - pos: 3
    q: "Do you currently use vaping products or e-cigarettes daily?"
  - pos: 4
    q: "Do you use smokeless tobacco products (chewing tobacco, snuff) regularly?"
  - pos: 5
    q: "Do you use nicotine pouches (such as Zyn) daily?"
  - pos: 6
    q: "Have you attempted to quit all nicotine products in the past 12 months?"
    v: true

  # ---- Alcohol Use and Recovery ----
  - pos: 7
    q: "Do you currently consume alcoholic beverages?"
  - pos: 8
    q: "Do you consume alcohol weekly or more frequently?"
  - pos: 9
    q: "Have you had 4 or more drinks (for women) or 5 or more (for men) in a single day in the past month?"
  - pos: 10
    q: "Do you consider yourself to be in active recovery from alcohol use?"
    v: true
  - pos: 11
    q: "Do you attend support groups (such as AA or SMART Recovery) for alcohol or substance use?"
    v: true
  - pos: 12
    q: "Are you currently taking prescription medication to support sobriety (such as naltrexone or disulfiram)?"
    v: true

  # ---- Cannabis and Other Substance History ----
  - pos: 13
    q: "Have you used cannabis products in the past 12 months?"
  - pos: 14
    q: "Do you use cannabis medicinally under a prescription or state card?"
    v: true
  - pos: 15
    q: "Do you regularly use CBD-only products for health or sleep?"
    v: true
  - pos: 16
    q: "Have you ever used stimulants recreationally (such as cocaine or amphetamines)?"
  - pos: 17
    q: "Have you ever used opioids recreationally (such as heroin or non-prescribed pain pills)?"
  - pos: 18
    q: "Have you ever used psychedelics recreationally (such as psilocybin or LSD)?"
    v: true
  - pos: 19
    q: "Have you ever used dissociative substances (such as ketamine) recreationally?"
  - pos: 20
    q: "Have you ever used inhalants recreationally?"

  # ---- Treatment, Caffeine, and Harm Reduction ----
  - pos: 21
    q: "Are you currently in recovery from a substance use disorder?"
    v: true
  - pos: 22
    q: "Have you ever attended an inpatient rehabilitation program for substance use?"
  - pos: 23
    q: "Are you currently taking medication-assisted treatment for opioid use (such as methadone or buprenorphine)?"
    v: true
  - pos: 24
    q: "Do you currently take a prescription controlled substance (such as stimulants or benzos) daily?"
  - pos: 25
    q: "Have you been prescribed an opioid pain medication in the past 12 months?"
  - pos: 26
    q: "Do you consume caffeine daily?"
  - pos: 27
    q: "Do you typically consume more than 400 milligrams of caffeine (approx. 4 cups of coffee) daily?"
  - pos: 28
    q: "Have you tried to reduce or quit caffeine in the past 12 months?"
    v: true
  - pos: 29
    q: "Do you regularly use kratom?"
  - pos: 30
    q: "Do you consume energy drinks daily or weekly?"
  - pos: 31
    q: "Have you ever experienced physical withdrawal symptoms when stopping any substance?"
  - pos: 32
    q: "Do you have a family history of alcohol or substance use disorder in a parent or sibling?"
  - pos: 33
    q: "Do you have immediate access to naloxone (Narcan) in your home or bag?"
    v: true
  - pos: 34
    q: "Have you completed training on overdose response and naloxone administration?"
    v: true

  # ---- Self-Monitoring ----
  - pos: 35
    q: "Do you track your daily resting statistics related to substances health?"
    v: true
  - pos: 36
    q: "Do you feel that your substances health has improved over the past 12 months?"
    v: true
  - pos: 37
    q: "Do you log your substances symptoms weekly in a journal or app?"
    v: true
  - pos: 38
    q: "Have you discussed your substances health goals with a specialist?"
    v: true
  - pos: 39
    q: "Do you wear a device that tracks metrics relevant to your substances recovery?"
    v: true
  - pos: 40
    q: "Do you avoid environmental triggers that worsen your substances symptoms?"
    v: true
  - pos: 41
