pattern: 12
domain: Recovery & Sleep
spec_version: 0.1.1
status: DRAFT
authored_by: jamal
last_revised: 2026-04-30
polarity_note: "V flag inverts bit storage; question text is never inverted."
ratification: pending community review
scope_exclusions:

questions:

  # ---- Sleep Duration and Timing ----
  - pos: 1
    q: "Do you typically sleep less than 6 hours per night?"
  - pos: 2
    q: "Do you typically sleep between 6 and 7 hours per night?"
  - pos: 3
    q: "Do you typically sleep between 7 and 9 hours per night?"
    v: true
  - pos: 4
    q: "Do you typically sleep more than 9 hours per night?"
    v: true
  - pos: 5
    q: "Do you experience highly variable sleep duration (varying by more than 2 hours) across the week?"
  - pos: 6
    q: "Do you maintain a consistent bedtime (within 30 minutes) on most nights?"
    v: true
  - pos: 7
    q: "Do you maintain a consistent wake time (within 30 minutes) on most mornings?"
    v: true
  - pos: 8
    q: "Do you consider yourself a 'night owl' (preferring late bed and wake times)?"
    v: true
  - pos: 9
    q: "Do you consider yourself a 'morning person' (preferring early bed and wake times)?"
    v: true
  - pos: 10
    q: "Do you work night shifts regularly?"
  - pos: 11
    q: "Do you work a rotating shift schedule that affects your sleep timing?"
  - pos: 12
    q: "Have you experienced significant jet lag in the past 3 months?"

  # ---- Sleep Quality and Disorders ----
  - pos: 13
    q: "Do you subjectively rate your overall sleep quality as poor on most nights?"
  - pos: 14
    q: "Do you typically fall asleep within 20 minutes of turning off the lights?"
    v: true
  - pos: 15
    q: "Do you regularly stay asleep throughout the night without waking up?"
    v: true
  - pos: 16
    q: "Do you wake up feeling refreshed and alert on most mornings?"
    v: true
  - pos: 17
    q: "Have you been diagnosed with clinical insomnia?"
  - pos: 18
    q: "Have you been diagnosed with obstructive sleep apnea?"
  - pos: 19
    q: "Have you been diagnosed with narcolepsy?"
  - pos: 20
    q: "Have you been diagnosed with restless legs syndrome?"
  - pos: 21
    q: "Have you been diagnosed with REM sleep behavior disorder?"
  - pos: 22
    q: "Have you been diagnosed with delayed sleep phase disorder?"
  - pos: 23
    q: "Have you been diagnosed with a circadian rhythm sleep-wake disorder?"

  # ---- Sleep Aids and Environment ----
  - pos: 24
    q: "Do you currently use a CPAP or BiPAP machine during sleep?"
    v: true
  - pos: 25
    q: "Do you take a prescription sleep medication regularly?"
  - pos: 26
    q: "Do you regularly take melatonin to support sleep?"
    v: true
  - pos: 27
    q: "Do you regularly take a magnesium supplement to support sleep?"
    v: true
  - pos: 28
    q: "Do you use cannabis products specifically to help you sleep?"
    v: true
  - pos: 29
    q: "Do you consume alcohol within 2 hours of bedtime to help you fall asleep?"
  - pos: 30
    q: "Do you sleep in a room that is kept completely dark (using blackout curtains)?"
    v: true
  - pos: 31
    q: "Do you sleep in a room that is kept cool (below 68 degrees F / 20 degrees C)?"
    v: true
  - pos: 32
    q: "Do you use a white noise machine or fan to mask background noise during sleep?"
    v: true
  - pos: 33
    q: "Do you share your bed with a partner?"
    v: true
  - pos: 34
    q: "Do you allow pets to sleep in your bed?"
    v: true
  - pos: 35
    q: "Do you have a dedicated bedroom used primarily for sleep and intimacy?"
    v: true

  # ---- Routines, Alertness, and Stress Management ----
  - pos: 36
    q: "Do you have a consistent wind-down routine before bedtime?"
    v: true
  - pos: 37
    q: "Do you avoid looking at electronic screens for at least 1 hour before bed?"
    v: true
  - pos: 38
    q: "Do you read a printed book or e-reader without blue light before bed?"
    v: true
  - pos: 39
    q: "Do you practice meditation or relaxation exercises before bed?"
    v: true
  - pos: 40
    q: "Do you regularly use a wearable device (such as a ring or watch) to track your sleep?"
    v: true
  - pos: 41
    q: "Do you track your sleep quality using a phone application?"
    v: true
  - pos: 42
    q: "Do you use a smart mattress or under-mattress tracker?"
    v: true
  - pos: 43
    q: "Do you experience significant daytime sleepiness that affects your productivity?"
  - pos: 44
    q: "Do you take regular daytime naps?"
    v: true
  - pos: 45
    q: "Do you fall asleep unintentionally during quiet activities in the day?"
  - pos: 46
    q: "Do you rely on caffeine to stay alert during the afternoon?"
  - pos: 47
    q: "Do you practice a regular mindfulness or meditation technique during the day?"
    v: true
  - pos: 48
    q: "Do you practice structured breathwork exercises regularly?"
    v: true
  - pos: 49
    q: "Do you take regular rest days from intense physical activity?"
    v: true
  - pos: 50
    q: "Do you monitor your heart rate variability (HRV) daily?"
    v: true

  # ---- Recovery Modalities, Overtraining, and Dreams ----
  - pos: 51
    q: "Do you use a sauna weekly to support recovery?"
    v: true
  - pos: 52
    q: "Do you use cold therapy (ice baths or plunges) weekly?"
    v: true
  - pos: 53
    q: "Do you use compression garments or boots for recovery?"
    v: true
  - pos: 54
    q: "Do you use red light therapy weekly?"
    v: true
  - pos: 55
    q: "Do you receive professional massage therapy regularly?"
    v: true
  - pos: 56
    q: "Do you prioritize active recovery (like light walking) on rest days?"
    v: true
  - pos: 57
    q: "Do you monitor your overall training load to prevent overreaching?"
    v: true
  - pos: 58
    q: "Have you experienced symptoms of burnout in the past 12 months?"
  - pos: 59
    q: "Have you experienced symptoms of overtraining in the past 12 months?"
  - pos: 60
    q: "Have you taken an extended break from work or training due to severe fatigue in the past year?"
  - pos: 61
    q: "Do you experience highly vivid dreams regularly?"
    v: true
  - pos: 62
    q: "Do you experience frequent nightmares?"
  - pos: 63
    q: "Do you regularly experience lucid dreaming (knowing you are dreaming)?"
    v: true
  - pos: 64
    q: "Have you ever experienced episodes of sleep paralysis?"

