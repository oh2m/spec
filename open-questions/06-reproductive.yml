pattern: 6
domain: Reproductive
spec_version: 0.1.1
status: DRAFT
authored_by: jamal
last_revised: 2026-04-30
polarity_note: "V flag inverts bit storage; question text is never inverted."
ratification: pending community review
scope_exclusions:
  - "Specific abortion details beyond a single historical yes/no"
  - "Sexual partner counts, identities, or specific practices"
  - "Specific assault or coercion event details"

questions:

  # ---- Anatomy and Surgical History ----
  - pos: 1
    q: "Have you ever undergone a hysterectomy (surgical removal of the uterus)?"
  - pos: 2
    q: "Have you ever undergone a oophorectomy (surgical removal of one or both ovaries)?"
  - pos: 3
    q: "Have you ever undergone a vasectomy (surgical sterilization)?"
  - pos: 4
    q: "Have you ever undergone a tubal ligation or salpingectomy (tubal sterilization)?"
  - pos: 5
    q: "Have you ever undergone a orchiectomy (surgical removal of one or both testicles)?"
  - pos: 6
    q: "Have you ever undergone a gender-affirming reproductive surgery (such as vaginoplasty or phalloplasty)?"

  # ---- Pregnancy and Cyclic Context ----
  - pos: 7
    q: "Have you ever been pregnant?"
  - pos: 8
    q: "Have you ever given birth to a child?"
  - pos: 9
    q: "Have you ever experienced a miscarriage (pregnancy loss before 20 weeks)?"
  - pos: 10
    q: "Have you ever experienced a stillbirth (pregnancy loss after 20 weeks)?"
  - pos: 11
    q: "Have you ever undergone a pregnancy termination (abortion)?"
  - pos: 12
    q: "Have you ever given birth via Caesarean section (C-section)?"
  - pos: 13
    q: "Have you ever experienced gestational diabetes during a pregnancy?"
  - pos: 14
    q: "Have you ever experienced preeclampsia or high blood pressure during pregnancy?"
  - pos: 15
    q: "Are you currently pregnant?"
  - pos: 16
    q: "Are you currently trying to conceive?"
  - pos: 17
    q: "Are you currently breastfeeding or chestfeeding?"

  # ---- Menstrual and Hormonal Health ----
  - pos: 18
    q: "Do you currently experience regular menstrual periods?"
    v: true
  - pos: 19
    q: "Do you experience irregular or highly unpredictable menstrual cycles?"
  - pos: 20
    q: "Have you been diagnosed with endometriosis?"
  - pos: 21
    q: "Have you been diagnosed with polycystic ovary syndrome (PCOS)?"
  - pos: 22
    q: "Have you been diagnosed with Premenstrual Dysphoric Disorder (PMDD)?"
  - pos: 23
    q: "Are you currently experiencing perimenopausal symptoms (such as hot flashes or night sweats)?"
  - pos: 24
    q: "Are you post-menopausal (no periods for 12 or more consecutive months)?"
  - pos: 25
    q: "Are you currently taking hormone replacement therapy (HRT) for menopause symptoms?"
    v: true
  - pos: 26
    q: "Are you currently taking gender-affirming hormone therapy (estrogen or testosterone)?"
    v: true

  # ---- Fertility and Contraception ----
  - pos: 27
    q: "Have you ever been diagnosed with infertility by a specialist?"
  - pos: 28
    q: "Have you ever used fertility treatments (such as IVF, IUI, or fertility medications)?"
  - pos: 29
    q: "Have you cryopreserved (banked) eggs, sperm, or embryos for future use?"
    v: true
  - pos: 30
    q: "Are you currently taking hormonal contraception (pill, patch, ring, or injection)?"
    v: true
  - pos: 31
    q: "Do you currently have an intrauterine device (IUD) inserted?"
    v: true
  - pos: 32
    q: "Do you use barrier contraception (condoms) regularly during sexual activity?"
    v: true

  # ---- Sexual Health and Preventative Screening ----
  - pos: 33
    q: "Have you ever been diagnosed with a sexually transmitted infection (STI)?"
  - pos: 34
    q: "Have you been screened for STIs in the past 12 months?"
    v: true
  - pos: 35
    q: "Have you completed the HPV (human papillomavirus) vaccine series?"
    v: true
  - pos: 36
    q: "Have you had a cervical cancer screening (Pap smear or HPV test) in the past 3 years?"
    v: true
  - pos: 37
    q: "Have you had a mammogram in the past 2 years (if age-appropriate)?"
    v: true
  - pos: 38
    q: "Have you had a clinical prostate exam or PSA blood test (if age-appropriate)?"
    v: true
  - pos: 39
    q: "Do you experience sexual dysfunction (such as painful intercourse or erectile dysfunction) that affects your quality of life?"
  - pos: 40
    q: "Are you currently taking medication to support sexual function?"
  - pos: 41
    q: "Do you have a family history of breast cancer in a first-degree relative?"
  - pos: 42
    q: "Do you have a family history of ovarian cancer in a first-degree relative?"
  - pos: 43
    q: "Do you have a family history of prostate cancer in a first-degree relative?"
  - pos: 44
    q: "Do you know your BRCA gene status (tested positive or negative)?"
    v: true

  # ---- Self-Monitoring ----
  - pos: 45
    q: "Do you track your daily resting statistics related to reproductive health?"
    v: true
  - pos: 46
    q: "Do you feel that your reproductive health has improved over the past 12 months?"
    v: true
  - pos: 47
    q: "Do you log your reproductive symptoms weekly in a journal or app?"
    v: true
  - pos: 48
    q: "Have you discussed your reproductive health goals with a specialist?"
    v: true
  - pos: 49
    q: "Do you wear a device that tracks metrics relevant to your reproductive recovery?"
    v: true
