pattern: 14
domain: Genetics & Family History
spec_version: 0.1.1
status: DRAFT
authored_by: jamal
last_revised: 2026-04-30
polarity_note: "V flag inverts bit storage; question text is never inverted."
ratification: pending community review
scope_exclusions:
  - "Specific gene-level results (e.g., specific BRCA variants, specific APOE alleles)"
  - "Predictive testing results for adult-onset untreatable conditions where the user has not opted to disclose"
  - "Identifying information about family members beyond relationship (e.g., names, ages, specifics)"

questions:

  # ---- Genetic Testing and Carrier Status ----
  - pos: 1
    q: "Have you ever undergone any genetic testing?"
    v: true
  - pos: 2
    q: "Have you used a consumer DNA service (such as 23andMe or AncestryDNA)?"
    v: true
  - pos: 3
    q: "Have you undergone clinical genetic testing ordered by a medical professional?"
    v: true
  - pos: 4
    q: "Have you undergone pharmacogenomic testing to check how you metabolize medications?"
    v: true
  - pos: 5
    q: "Have you had your whole genome sequenced?"
    v: true
  - pos: 6
    q: "Have you tested positive for a known hereditary cancer syndrome (such as BRCA)?"
  - pos: 7
    q: "Have you tested positive for a hereditary cardiovascular condition?"
  - pos: 8
    q: "Have you tested positive for a hereditary metabolic condition?"
  - pos: 9
    q: "Have you tested positive for a hereditary neurological condition?"
  - pos: 10
    q: "Have you tested positive for a hereditary blood disorder?"
  - pos: 11
    q: "Are you a known carrier for a recessive genetic condition (such as sickle cell trait or cystic fibrosis)?"
  - pos: 12
    q: "Have you had carrier screening performed as part of family planning?"
    v: true

  # ---- Family History of Disease ----
  - pos: 13
    q: "Do you have a family history of early coronary artery disease or heart attack in a father or brother before age 55?"
  - pos: 14
    q: "Do you have a family history of early coronary artery disease or heart attack in a mother or sister before age 65?"
  - pos: 15
    q: "Do you have a family history of stroke in a first-degree relative (parent or sibling)?"
  - pos: 16
    q: "Do you have a family history of sudden unexplained cardiac death in a first-degree relative under age 50?"
  - pos: 17
    q: "Do you have a family history of familial hypercholesterolemia (genetic high cholesterol) in your family?"
  - pos: 18
    q: "Do you have a family history of breast cancer in a first-degree relative?"
  - pos: 19
    q: "Do you have a family history of ovarian cancer in a first-degree relative?"
  - pos: 20
    q: "Do you have a family history of colon cancer in a first-degree relative?"
  - pos: 21
    q: "Do you have a family history of prostate cancer in a first-degree relative?"
  - pos: 22
    q: "Do you have a family history of melanoma in a first-degree relative?"
  - pos: 23
    q: "Do you have a family history of pancreatic cancer in a first-degree relative?"
  - pos: 24
    q: "Do you have a family history of any cancer diagnosed in a first-degree relative before age 50?"
  - pos: 25
    q: "Do you have a family history of Type 1 diabetes in a first-degree relative?"
  - pos: 26
    q: "Do you have a family history of Type 2 diabetes in a first-degree relative?"
  - pos: 27
    q: "Do you have a family history of thyroid disease in a parent or sibling?"
  - pos: 28
    q: "Do you have a family history of severe obesity in multiple close family members?"
  - pos: 29
    q: "Do you have a family history of Alzheimer's disease or dementia in a parent or sibling?"
  - pos: 30
    q: "Do you have a family history of Parkinson's disease in a first-degree relative?"
  - pos: 31
    q: "Do you have a family history of amyotrophic lateral sclerosis (ALS) in your family?"
  - pos: 32
    q: "Do you have a family history of Huntington's disease in your family?"
  - pos: 33
    q: "Do you have a family history of multiple sclerosis in a parent or sibling?"
  - pos: 34
