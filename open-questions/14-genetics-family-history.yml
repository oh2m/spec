  - pos: 39
    q: "Do you have a family history of substance use disorder or alcoholism in a parent or sibling?"
  - pos: 40
    q: "Do you have a family history of autoimmune disease (such as lupus or rheumatoid arthritis) in a first-degree relative?"

  # ---- Reproductive Genetics, Privacy, and History Gaps ----
  - pos: 41
    q: "Have you used preimplantation genetic testing (PGT) during fertility treatment?"
    v: true
  - pos: 42
    q: "Have you had prenatal genetic testing performed during a pregnancy?"
    v: true
  - pos: 43
    q: "Have you ever disclosed genetic test results to a life or disability insurance company?"
  - pos: 44
    q: "Have you ever refused genetic testing due to privacy or employment discrimination concerns?"
  - pos: 45
    q: "Are your immediate family members fully aware of any genetic risk factors you hold?"
    v: true
  - pos: 46
    q: "Are you adopted and possess limited or no information about your biological family medical history?"
  - pos: 47
    q: "Were you conceived using donor gametes (sperm or egg) and have limited biological history?"
  - pos: 48
    q: "Do you have incomplete family history information due to estrangement or missing relatives?"

