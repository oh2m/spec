pattern: 5
domain: Mental Health
spec_version: 0.1.1
status: DRAFT
authored_by: jamal
last_revised: 2026-04-30
polarity_note: "V flag inverts bit storage; question text is never inverted. See spec for details."
ratification: pending community review
scope_exclusions:
  - "Active suicidal ideation, planning, or intent"
  - "Active self-harm behaviors"
  - "Current dissociative episodes"
  - "Acute psychotic symptoms"
  - "Any question requiring immediate clinical follow-up to be safe"

questions:

  # ---- Diagnosed Conditions ----
  - pos: 1
    q: "Have you ever been diagnosed with depression (major depressive disorder) by a healthcare professional?"
  - pos: 2
    q: "Have you ever been diagnosed with generalized anxiety disorder (GAD) by a healthcare professional?"
  - pos: 3
    q: "Have you ever been diagnosed with panic disorder by a healthcare professional?"
  - pos: 4
    q: "Have you ever been diagnosed with social anxiety disorder (social phobia) by a healthcare professional?"
  - pos: 5
    q: "Have you ever been diagnosed with post-traumatic stress disorder (PTSD) by a healthcare professional?"
  - pos: 6
    q: "Have you ever been diagnosed with obsessive-compulsive disorder (OCD) by a healthcare professional?"
  - pos: 7
    q: "Have you ever been diagnosed with bipolar I or II disorder by a healthcare professional?"
  - pos: 8
    q: "Have you ever been diagnosed with schizophrenia or schizoaffective disorder by a healthcare professional?"
  - pos: 9
    q: "Have you ever been diagnosed with attention-deficit hyperactivity disorder (ADHD) by a healthcare professional?"
  - pos: 10
    q: "Have you ever been diagnosed with autism spectrum disorder (ASD) by a healthcare professional?"
  - pos: 11
    q: "Have you ever been diagnosed with an eating disorder (such as anorexia, bulimia, or binge eating) by a healthcare professional?"
  - pos: 12
    q: "Have you ever been diagnosed with a personality disorder (such as borderline or obsessive-compulsive personality disorder) by a healthcare professional?"
  - pos: 13
    q: "Have you ever been diagnosed with premenstrual dysphoric disorder (PMDD) by a healthcare professional?"
  - pos: 14
    q: "Have you ever been diagnosed with seasonal affective disorder (SAD) by a healthcare professional?"
  - pos: 15
    q: "Have you ever been diagnosed with persistent depressive disorder (dysthymia) by a healthcare professional?"

  # ---- Current Treatment and Care History ----
  - pos: 16
    q: "Are you currently seeing a licensed therapist or counsellor regularly?"
    v: true
  - pos: 17
    q: "Are you currently seeing a psychiatrist for medication management?"
    v: true
  - pos: 18
    q: "Are you currently taking a prescription antidepressant medication?"
  - pos: 19
    q: "Are you currently taking a prescription mood stabilizer medication?"
  - pos: 20
    q: "Are you currently taking a prescription stimulant medication for ADHD?"
  - pos: 21
    q: "Are you currently taking a prescription antipsychotic medication?"
  - pos: 22
    q: "Are you currently taking a prescription anxiolytic (anti-anxiety) medication?"
  - pos: 23
    q: "Have you ever been hospitalized for psychiatric reasons?"
  - pos: 24
    q: "Have you ever completed a structured course of psychotherapy (such as CBT or DBT)?"
    v: true
  - pos: 25
    q: "Have you been taking psychiatric medication continuously for more than 12 months?"

  # ---- Functional Impact ----
  - pos: 26
    q: "Have your mental health symptoms significantly impacted your work or school performance in the past 12 months?"
  - pos: 27
    q: "Have your mental health symptoms caused significant difficulties in your close relationships in the past 12 months?"
  - pos: 28
    q: "Do you experience chronic sleep disturbances (insomnia or hypersomnia) due to stress or mood?"
  - pos: 29
    q: "Do you experience significant changes in appetite or weight when your mood is low?"
  - pos: 30
    q: "Do you experience physical symptoms (like muscle tension, headaches, or stomach aches) due to anxiety?"
  - pos: 31
    q: "Do you experience difficulty concentrating or making decisions in your daily life due to mood?"
  - pos: 32
    q: "Do you regularly withdraw from social activities due to how you are feeling?"
  - pos: 33
    q: "Do you experience episodes of intense, sudden panic or fear that feel overwhelming?"
  - pos: 34
    q: "Do you experience persistent low energy or fatigue even after adequate sleep?"
  - pos: 35
    q: "Do you find it difficult to experience pleasure in activities you normally enjoy?"

  # ---- Coping Resources and Support ----
  - pos: 36
    q: "Do you have a reliable support network of friends or family you can talk to when struggling?"
    v: true
  - pos: 37
    q: "Do you practice a regular mindfulness, meditation, or relaxation technique?"
    v: true
  - pos: 38
    q: "Do you feel comfortable discussing your mental health with your primary care provider?"
    v: true
  - pos: 39
    q: "Do you have a written crisis plan or psychiatric advance directive?"
    v: true
  - pos: 40
    q: "Have you designated a healthcare proxy or decision-maker in case of psychiatric incapacitation?"
    v: true
  - pos: 41
    q: "Do you engage in regular physical exercise specifically to support your mental well-being?"
    v: true
  - pos: 42
    q: "Do you feel you have access to adequate mental health resources when you need them?"
    v: true

  # ---- Family History and Childhood Context ----
  - pos: 43
    q: "Do you have a first-degree relative (parent or sibling) diagnosed with a major mood disorder?"
  - pos: 44
    q: "Do you have a first-degree relative diagnosed with schizophrenia or a psychotic disorder?"
  - pos: 45
    q: "Do you have a family history of substance use disorder or alcoholism?"
  - pos: 46
    q: "Do you have a first-degree relative who died by suicide?"
  - pos: 47
    q: "Do you feel that you experienced significant childhood adversity or family stress growing up?"
  - pos: 48
    q: "Do you have a family history of ADHD or autism spectrum conditions?"

  # ---- Self-Monitoring ----
  - pos: 49
    q: "Do you track your daily resting statistics related to mental health health?"
    v: true
  - pos: 50
    q: "Do you feel that your mental health health has improved over the past 12 months?"
    v: true
  - pos: 51
    q: "Do you log your mental health symptoms weekly in a journal or app?"
    v: true
  - pos: 52
    q: "Have you discussed your mental health health goals with a specialist?"
    v: true
  - pos: 53
    q: "Do you wear a device that tracks metrics relevant to your mental health recovery?"
    v: true
  - pos: 54
    q: "Do you avoid environmental triggers that worsen your mental health symptoms?"
    v: true
  - pos: 55
    q: "Do you feel that your sleep quality directly impacts your mental health health?"
    v: true
  - pos: 56
    q: "Do you research new research or updates regarding mental health wellness?"
    v: true
  - pos: 57
    q: "Do you feel confident managing your mental health health at home?"
    v: true
  - pos: 58
    q: "Have you had a comprehensive physical exam in the past 12 months?"
    v: true
  - pos: 59
