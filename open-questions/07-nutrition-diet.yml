  # ---- Dietary Patterns ----
  - pos: 1
    q: "Do you follow a vegetarian by choice?"
    v: true
  - pos: 2
    q: "Do you follow a vegan (purely plant-based) by choice?"
    v: true
  - pos: 3
    q: "Do you follow a pescatarian (fish and vegetarian) by choice?"
    v: true
  - pos: 4
    q: "Do you follow a Mediterranean diet by choice?"
    v: true
  - pos: 5
    q: "Do you follow a ketogenic or very low-carbohydrate diet by choice?"
