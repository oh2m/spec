    q: "Do you track your daily resting statistics related to recent medical activity health?"
    v: true
  - pos: 35
    q: "Do you feel that your recent medical activity health has improved over the past 12 months?"
    v: true
  - pos: 36
    q: "Do you log your recent medical activity symptoms weekly in a journal or app?"
    v: true
  - pos: 37
    q: "Have you discussed your recent medical activity health goals with a specialist?"
    v: true
  - pos: 38
    q: "Do you wear a device that tracks metrics relevant to your recent medical activity recovery?"
    v: true
