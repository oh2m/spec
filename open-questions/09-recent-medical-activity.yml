pattern: 9
domain: Recent Medical Activity
spec_version: 0.1.1
status: DRAFT
authored_by: jamal
last_revised: 2026-04-30
polarity_note: "V flag inverts bit storage; question text is never inverted."
ratification: pending community review
scope_exclusions:

questions:

  # ---- Major Care Events ----
  - pos: 1
    q: "Have you been admitted as an inpatient to a hospital in the past 12 months?"
  - pos: 2
    q: "Have you visited an emergency department for care in the past 12 months?"
  - pos: 3
    q: "Have you undergone outpatient surgery in the past 12 months?"
  - pos: 4
    q: "Have you undergone a medical procedure requiring general anesthesia in the past 12 months?"

  # ---- Routine Care Attendance ----
  - pos: 5
    q: "Have you visited a primary care provider (PCP) for a check-up in the past 12 months?"
    v: true
  - pos: 6
    q: "Have you had a dental cleaning or exam in the past 12 months?"
    v: true
  - pos: 7
    q: "Have you had a comprehensive eye exam in the past 12 months?"
    v: true
  - pos: 8
    q: "Have you had a skin check by a dermatologist in the past 12 months?"
    v: true
  - pos: 9
    q: "Have you visited any medical specialist (e.g. cardiologist, endocrinologist) in the past 12 months?"
    v: true

  # ---- Diagnostic Testing and Immunizations ----
  - pos: 10
    q: "Have you had blood drawn for lab tests in the past 12 months?"
    v: true
  - pos: 11
    q: "Have you had a diagnostic imaging scan (MRI, CT, X-ray, or ultrasound) in the past 12 months?"
  - pos: 12
    q: "Have you had an electrocardiogram (ECG/EKG) in the past 12 months?"
    v: true
  - pos: 13
    q: "Have you had an endoscopy or colonoscopy procedure in the past 12 months?"
  - pos: 14
    q: "Have you undergone a preventative cancer screening (such as mammogram, Pap, or colonoscopy) in the past 12 months?"
    v: true
  - pos: 15
    q: "Have you received any vaccination in the past 12 months?"
    v: true
  - pos: 16
    q: "Have you received an annual influenza (flu) vaccine in the past 12 months?"
    v: true
  - pos: 17
    q: "Have you received a COVID-19 vaccine or booster in the past 12 months?"
    v: true

  # ---- New Diagnoses, Transitions, and Insurance ----
  - pos: 18
    q: "Have you received a new chronic disease diagnosis from a doctor in the past 12 months?"
  - pos: 19
    q: "Have you started a new daily prescription medication for a chronic condition in the past 12 months?"
  - pos: 20
    q: "Have you experienced a flu-like illness that lasted more than 3 days in the past 12 months?"
  - pos: 21
    q: "Have you taken a course of prescription antibiotics in the past 12 months?"
  - pos: 22
    q: "Have you had a documented or suspected COVID-19 infection in the past 12 months?"
  - pos: 23
    q: "Have you changed your primary care provider (PCP) in the past 12 months?"
  - pos: 24
    q: "Have you been referred to a new medical specialist in the past 12 months?"
  - pos: 25
    q: "Have you changed the dosage or type of a chronic medication in the past 12 months?"
  - pos: 26
    q: "Are you currently following up on an abnormal lab or imaging test result?"
  - pos: 27
    q: "Are you currently awaiting a scheduled surgery or medical procedure?"
  - pos: 28
    q: "Are you currently in active treatment for a serious illness (such as cancer)?"
  - pos: 29
    q: "Have you started or stopped a psychiatric medication in the past 12 months?"
  - pos: 30
    q: "Have you started a new relationship with a therapist or counsellor in the past 12 months?"
    v: true
  - pos: 31
    q: "Have you experienced a lapse in health insurance coverage in the past 12 months?"
  - pos: 32
    q: "Have you skipped or delayed needed medical care due to cost in the past 12 months?"
  - pos: 33
    q: "Are you currently a primary caregiver for an individual with a serious medical condition?"

  # ---- Self-Monitoring ----
