  - pos: 58
    q: "Have you experienced a major natural disaster (such as a flood, hurricane, or wildfire) in the past 5 years?"
  - pos: 59
    q: "Have you ever been evacuated from your home due to an environmental emergency?"
  - pos: 60
    q: "Do you live in a high-stress social environment with elevated community safety concerns?"
  - pos: 61
    q: "Have you experienced discrimination that you feel has directly affected your health?"
  - pos: 62
    q: "Do you feel your local community has strong social cohesion and support?"
    v: true

