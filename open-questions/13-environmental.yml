scope_exclusions:

questions:

  # ---- Air Quality (Outdoor and Indoor) ----
  - pos: 1
    q: "Do you live in an area where the outdoor Air Quality Index (AQI) regularly exceeds 100?"
  - pos: 2
    q: "Do you reside within 500 feet of a major highway or roadway?"
  - pos: 3
    q: "Do you reside near an active industrial facility or factory?"
  - pos: 4
    q: "Do you use a HEPA air purifier in your home?"
    v: true
  - pos: 5
    q: "Does your home have a central heating and cooling system with high-efficiency filters?"
    v: true
  - pos: 6
    q: "Do you live in an area prone to seasonal wildfires?"
  - pos: 7
    q: "Have you been displaced or experienced severe health symptoms due to wildfire smoke in the past 12 months?"
  - pos: 8
    q: "Have you had visible mold growth in your primary living space in the past 12 months?"
  - pos: 9
    q: "Have you had professional mold remediation performed in your home?"
  - pos: 10
    q: "Have you had your home tested for radon gas in the past 5 years?"
    v: true
  - pos: 11
    q: "Have you been notified of elevated radon levels in your home?"
  - pos: 12
    q: "Do you reside in a building that contains known asbestos materials?"
  - pos: 13
    q: "Do you have working carbon monoxide detectors installed near all sleeping areas?"
    v: true

  # ---- Water Safety and Occupational Exposure ----
  - pos: 14
    q: "Do you drink primarily unfiltered tap water at home?"
  - pos: 15
    q: "Do you drink primarily filtered water at home?"
    v: true
  - pos: 16
    q: "Do you drink primarily bottled water?"
  - pos: 17
    q: "Have you had your home tap water tested for contaminants in the past 5 years?"
    v: true
  - pos: 18
    q: "Do you live in an area with a known public water safety advisory?"
  - pos: 19
    q: "Does your home receive water from a private well?"
  - pos: 20
    q: "Are you regularly exposed to hazardous chemicals in your workplace?"
  - pos: 21
    q: "Are you regularly exposed to high levels of dust or airborne particulates at work?"
  - pos: 22
    q: "Are you regularly exposed to potential biological hazards (like pathogens or animal waste) at work?"
  - pos: 23
    q: "Are you regularly exposed to loud noise (above 85 decibels) in your working environment?"
  - pos: 24
    q: "Are you regularly exposed to ionizing radiation in your workplace?"
  - pos: 25
    q: "Do you work a night shift schedule?"
  - pos: 26
    q: "Does your primary job require significant physical labor daily?"
    v: true
  - pos: 27
    q: "Does your primary job require you to sit for more than 6 hours per day?"

  # ---- Built Environment, Climate, and Light ----
  - pos: 28
    q: "Do you live in a walkable neighborhood with sidewalks and crosswalks?"
    v: true
  - pos: 29
    q: "Do you have easy public access to parks, trails, or green spaces within walking distance?"
    v: true
  - pos: 30
    q: "Do you feel there are safe outdoor places for you to walk or run in your neighborhood?"
    v: true
  - pos: 31
    q: "Do you have access to a commercial gym or fitness facility nearby?"
    v: true
  - pos: 32
    q: "Do you own a home gym or fitness equipment?"
    v: true
  - pos: 33
    q: "Do you live in a climate that experiences extreme summer heat (regularly over 95 degrees F)?"
  - pos: 34
    q: "Do you live in a climate that experiences extreme winter cold (regularly below freezing)?"
  - pos: 35
    q: "Do you live at an altitude higher than 5,000 feet (1,500 meters) above sea level?"
    v: true
  - pos: 36
    q: "Do you experience seasonal allergies that require medication?"
  - pos: 37
    q: "Do you experience seasonal affective patterns (depressed mood in winter)?"
  - pos: 38
    q: "Do you get at least 15 minutes of direct sunlight exposure daily?"
    v: true
  - pos: 39
    q: "Do you live in a high-latitude region with significant winter darkness?"
  - pos: 40
    q: "Do you work in an environment with no windows or natural light?"

  # ---- Noise, Travel, Historical Exposure, and Disasters ----
  - pos: 41
    q: "Do you live in a high-noise environment (near airports, railways, or sirens)?"
  - pos: 42
    q: "Do you regularly use hearing protection in noisy working environments?"
    v: true
  - pos: 43
    q: "Do you use hearing protection during loud recreational activities (such as concerts or shooting)?"
    v: true
  - pos: 44
    q: "Have you traveled internationally in the past 12 months?"
    v: true
  - pos: 45
    q: "Do you travel frequently (more than once a month) for work?"
  - pos: 46
    q: "Have you lived in 3 or more different countries in your lifetime?"
    v: true
  - pos: 47
    q: "Have you ever lived in a region where infectious diseases like malaria or dengue are endemic?"
  - pos: 48
    q: "Were you potentially exposed to lead paint or lead pipes in your childhood home?"
  - pos: 49
    q: "Have you ever had a blood test showing elevated heavy metals (like lead or mercury)?"
  - pos: 50
    q: "Have you undergone 5 or more medical imaging scans with ionizing radiation (CT or X-ray) in your lifetime?"
  - pos: 51
    q: "Do you reside near an active nuclear power facility?"
  - pos: 52
    q: "Do you work with or near radiation-producing equipment?"
  - pos: 53
    q: "Do you live on a farm or work with farm animals?"
    v: true
  - pos: 54
    q: "Do you live with indoor cats or dogs?"
    v: true
  - pos: 55
