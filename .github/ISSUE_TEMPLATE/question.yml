name: General Question
description: Ask a general question about the specification, project, or usage
title: "[QUESTION]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have a general question about how to use OH2M or how to implement it? Ask here!
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know or clarify?
      placeholder: Ask your question...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any context (code snippet, spec section, or file format example) that helps explain your question.
    validations:
      required: false
