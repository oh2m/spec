name: Question
description: Ask a question about the spec, file format, or how OH2M works.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome. If the answer reveals a gap in the documentation, we'll use it to improve the spec.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: What are you trying to do? What have you already read?
    validations:
      required: false
