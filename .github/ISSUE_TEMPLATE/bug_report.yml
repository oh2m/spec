name: Bug Report
description: Report a bug or error in the spec or tooling
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve OH2M! Please fill out the details below to report a bug.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How did you encounter this bug? Include sample .oh2m files or code snippets if possible.
      placeholder: |
        1. Open file...
        2. Run parser...
        3. Encounter error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, operating system, parser version, or logs here.
    validations:
      required: false
