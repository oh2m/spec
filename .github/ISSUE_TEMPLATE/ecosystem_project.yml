name: Ecosystem Project
description: Share an app, service, or integration built on OH2M.
title: "[Ecosystem] "
labels: ["ecosystem"]
body:
  - type: markdown
    attributes:
      value: |
        Built something on OH2M? Share it. Apps, services, integrations, research uses, demos — all welcome.

  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL (if public)
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: One paragraph is enough.
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Concept / design phase
        - In development
        - Beta / preview
        - Live / released
    validations:
      required: false

  - type: textarea
    id: oh2m-usage
    attributes:
      label: How does it use OH2M?
      description: Which layers and patterns? What problem does OH2M solve in your context?
    validations:
      required: false
