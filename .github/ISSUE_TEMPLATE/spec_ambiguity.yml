name: Specification Ambiguity
description: Report a section of the specification that is unclear or ambiguous
title: "[AMBIGUITY]: "
labels: ["spec-ambiguity", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        If you are implementing OH2M and encounter a section of the spec that can be interpreted in multiple ways, use this form to report it.
  - type: input
    id: spec-section
    attributes:
      label: Specification Section
      placeholder: E.g., Section 4.5 The Mask
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Ambiguity Description
      description: Explain what is ambiguous and show the relevant spec quote.
    validations:
      required: true
  - type: textarea
    id: interpretations
    attributes:
      label: Possible Interpretations
      description: Describe the different ways this text could be interpreted.
      placeholder: |
        Interpretation A: ...
        Interpretation B: ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on Implementations
      description: How does this ambiguity affect compatibility or interoperability between different parsers?
    validations:
      required: true
