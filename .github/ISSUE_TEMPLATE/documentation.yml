name: Documentation Update
description: Suggest improvements or corrections to documentation or guides
title: "[DOCS]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to suggest fixes for typos, unclear sections, formatting errors, or formatting improvements in the specification or README.
  - type: textarea
    id: documentation-part
    attributes:
      label: Section / Document Affected
      description: Which file or section of the spec or README needs updating?
      placeholder: E.g., Section 4.5 of spec-repo/spec/OH2M-Specification-v0.1.1.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current Issue / Problem
      description: Describe what is currently wrong, confusing, or incomplete.
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed Change
      description: What is your suggested wording, layout, or fix?
    validations:
      required: true
